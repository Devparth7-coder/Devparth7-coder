<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Durable execution contract">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A0D12"/>
      <stop offset="60%"  stop-color="#0E1319"/>
      <stop offset="100%" stop-color="#160C10"/>
    </linearGradient>
    <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E63946" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="prule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E63946" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#E63946" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#E6EDF3" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="pframe"><rect width="1000" height="210" rx="10"/></clipPath>
    <path id="track" d="M34 106 L966 106"/>
  </defs>

  <g clip-path="url(#pframe)">
    <rect width="1000" height="210" fill="url(#pink)"/>
    <rect width="1000" height="210" fill="url(#pgrid)"/>

    <text x="34" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11" letter-spacing="3.2" fill="#E63946">DURABLE EXECUTION CONTRACT</text>
    <rect x="34" y="46" width="96" height="1.6" fill="url(#prule)"/>

    <line x1="34" y1="106" x2="966" y2="106" stroke="url(#pedge)" stroke-width="1.5"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#C9D1D9" text-anchor="middle">
      <rect x="34"  y="88" width="88"  height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="78"  y="111">Request</text>

      <rect x="146" y="88" width="80"  height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="186" y="111">Intent</text>

      <rect x="250" y="88" width="70"  height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="285" y="111">Plan</text>

      <rect x="344" y="88" width="116" height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="402" y="111">Agent select</text>

      <rect x="484" y="88" width="96"  height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="532" y="111">Tool call</text>

      <rect x="604" y="88" width="104" height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="656" y="111">Reasoning</text>

      <rect x="732" y="88" width="78"  height="36" rx="6" fill="#1A0E12" stroke="#E63946"/>
      <text x="771" y="111" fill="#E63946">Critic</text>

      <rect x="834" y="88" width="82"  height="36" rx="6" fill="#11161D" stroke="#2A313B"/>
      <text x="875" y="111">Result</text>
    </g>

    <circle r="4.2" fill="#F5F7FA">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <path d="M771 132 Q600 178 402 138" fill="none" stroke="#E63946" stroke-opacity="0.5"
          stroke-width="1.3" stroke-dasharray="4 4"/>
    <text x="586" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11" fill="#8B949E" text-anchor="middle">retry on failed claims &#183; bounded at 2 iterations</text>

    <text x="34" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10.5" fill="#6E7681">every stage persisted as an ordered event &#183; replayable &#183; inspectable</text>

    <rect x="0.5" y="0.5" width="999" height="209" rx="10" fill="none" stroke="#E63946" stroke-opacity="0.18"/>
  </g>
</svg>
