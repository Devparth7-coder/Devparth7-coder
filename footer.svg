<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A0E12"/>
      <stop offset="55%"  stop-color="#0E1319"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E63946" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#E63946" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#E6EDF3" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="fframe"><rect width="1000" height="130" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#fframe)">
    <rect width="1000" height="130" fill="url(#fink)"/>
    <rect width="1000" height="130" fill="url(#fgrid)"/>
    <rect x="0" y="0" width="1000" height="2" fill="url(#frule)"/>

    <text x="392" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13.5" fill="#E63946">$</text>
    <text x="408" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13.5" fill="#8B949E">git commit -m &#8220;still building&#8221;</text>

    <text x="500" y="82" text-anchor="middle"
          font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="13.5" font-style="italic" fill="#6E7681">
      the build goes green at 4 a.m.
    </text>

    <circle cx="452" cy="104" r="3.2" fill="#E63946">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="466" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2.4" fill="#E63946">DEV PARTH</text>

    <rect x="0.5" y="0.5" width="999" height="129" rx="10" fill="none" stroke="#E63946" stroke-opacity="0.18"/>
  </g>
</svg>
